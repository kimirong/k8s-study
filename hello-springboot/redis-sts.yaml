# ============ 两个 PV（worker2 上两块独立目录）============
apiVersion: v1
kind: PersistentVolume
metadata: { name: redis-sts-pv-0 }
spec:
  capacity: { storage: 1Gi }
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - { key: kubernetes.io/hostname, operator: In, values: ["k8s-worker2"] }
  hostPath: { path: /data/redis-sts-0 }
---
apiVersion: v1
kind: PersistentVolume
metadata: { name: redis-sts-pv-1 }
spec:
  capacity: { storage: 1Gi }
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - { key: kubernetes.io/hostname, operator: In, values: ["k8s-worker2"] }
  hostPath: { path: /data/redis-sts-1 }
---
# ============ Headless Service（给每个 Pod 稳定 DNS）============
apiVersion: v1
kind: Service
metadata:
  name: redis-sts
  labels: { app: redis-sts }
spec:
  clusterIP: None                  # ★ None = headless，不负载均衡，直接暴露每个 Pod
  selector: { app: redis-sts }
  ports:
  - { port: 6379, targetPort: 6379 }
---
# ============ StatefulSet ============
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sts
spec:
  serviceName: redis-sts           # ★ 关联 headless service，Pod 才能拿到域名
  replicas: 2
  selector: { matchLabels: { app: redis-sts } }
  template:
    metadata: { labels: { app: redis-sts } }
    spec:
      containers:
      - name: redis
        image: docker.m.daocloud.io/library/redis:7-alpine
        args: ["redis-server", "--appendonly", "yes"]
        ports: [{ containerPort: 6379 }]
        volumeMounts:
        - { name: data, mountPath: /data }
  volumeClaimTemplates:            # ★ 每副本自动生成一块 PVC（data-<pod名>）
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: manual
      resources:
        requests:
          storage: 1Gi
