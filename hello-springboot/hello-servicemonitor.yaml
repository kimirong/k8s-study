# ServiceMonitor：告诉 Prometheus"去抓 hello-app 的指标"
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hello-app-monitor
  labels:
    release: monitoring          # ★ 必须匹配 Prometheus 的 selector（release=monitoring）
spec:
  selector:
    matchLabels:
      app: hello-app             # 抓哪个 Service（按标签）
  endpoints:
  - port: http                   # Service 的端口名
    path: /actuator/prometheus   # Spring Boot 指标路径
    interval: 15s                # 每 15 秒抓一次
