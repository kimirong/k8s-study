# 部署我们的 Spring Boot 应用
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-spring
  labels:
    app: hello-spring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-spring
  template:
    metadata:
      labels:
        app: hello-spring
    spec:
      containers:
      - name: hello-spring
        image: hello-spring:2.0            # 本地镜像名（不推仓库）
        imagePullPolicy: IfNotPresent       # 关键：只在本地找不到才去拉
        ports:
        - containerPort: 8080
        readinessProbe:                     # ★ 就绪探针：k8s 靠它判断"这个 Pod 能不能接流量"
          httpGet:
            path: /hello
            port: 8080
          initialDelaySeconds: 5            # 启动 5 秒后开始探测
          periodSeconds: 5                  # 每 5 秒探测一次
---
apiVersion: v1
kind: Service
metadata:
  name: hello-spring
spec:
  type: NodePort
  selector:
    app: hello-spring
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081                        # 对外访问端口
