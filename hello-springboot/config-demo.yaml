# ============ ConfigMap：非敏感配置 ============
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_MODE: "dev"          # 应用模式
  LOG_LEVEL: "INFO"        # 日志级别
---
# ============ Secret：敏感信息 ============
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:                 # stringData 写明文，k8s 自动转成 base64 存起来
  DB_PASSWORD: "SuperSecret123"
  REDIS_PASSWORD: "redis-pwd"
---
# ============ Deployment：通过 envFrom 注入 ============
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-spring
  labels:
    app: hello-spring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-spring
  template:
    metadata:
      labels:
        app: hello-spring
    spec:
      containers:
      - name: hello-spring
        image: hello-spring:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:                    # ★ 整包注入：把 ConfigMap/Secret 的键值变成环境变量
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        readinessProbe:
          httpGet:
            path: /hello
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hello-spring
spec:
  type: NodePort
  selector:
    app: hello-spring
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081
